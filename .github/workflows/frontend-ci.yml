name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['laravel/**', 'render.yaml', 'README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['laravel/**', 'render.yaml', 'README.md']

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

  test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build:
    name: Build Release APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: apk/

      - name: Generate tag & release info
        id: release_info
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          TAG="v${VERSION}+build.${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Release ${{ steps.release_info.outputs.version }} (Build ${{ github.run_number }})
          body: |
            ## Aplikasi Booking Arfan Barbershop

            **Version:** ${{ steps.release_info.outputs.version }}
            **Commit:** ${{ steps.release_info.outputs.commit }}
            **Build:** ${{ github.run_number }}
          files: apk/app-release.apk
          fail_on_unmatched_files: false
